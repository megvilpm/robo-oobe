<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银河通用 · OOBE 开箱引导原型</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* ===== 基础重置与设计 token ===== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b11;            /* 深空蓝黑 */
  --bg2:#0b1220;           /* 次级背景 */
  --panel:#0e1726;         /* 面板 */
  --panel2:#14202f;        /* 面板升 */
  --line:rgba(120,160,200,.14);
  --line2:rgba(120,160,200,.28);
  --txt:#e6eef5;
  --txt2:#93a4b8;
  --txt3:#5d7289;
  --accent:#22d3aa;        /* 电光青：就绪/成功 */
  --accent2:#38bdf8;       /* 天蓝：进行中 */
  --warn:#fbbf24;
  --danger:#f87171;
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 背景网格与光晕 */
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(34,211,170,.08), transparent 60%),
    radial-gradient(800px 500px at 90% 110%, rgba(56,189,248,.07), transparent 60%);
}
.bg-deco::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(120,160,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,200,.045) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ===== 顶部品牌栏 ===== */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:16px 28px;border-bottom:1px solid var(--line);
  background:rgba(11,18,32,.7);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#0e2a33,#0b1220);border:1px solid rgba(34,211,170,.4)}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.02em}
.brand-name small{display:block;font-weight:400;color:var(--txt3);font-size:11px;letter-spacing:.12em}
.tabs{display:flex;gap:6px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:transparent;color:var(--txt2);font:500 13px/1 "Noto Sans SC";padding:9px 18px;border-radius:9px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px}
.tab svg{width:15px;height:15px}
.tab.on{background:linear-gradient(135deg,rgba(34,211,170,.16),rgba(56,189,248,.14));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(34,211,170,.35)}
.tagline{margin-left:auto;font-size:11px;color:var(--txt3);letter-spacing:.06em}
.tagline b{color:var(--accent);font-weight:600}

/* ===== 路由视图 ===== */
.view{display:none;flex:1}
.view.on{display:flex;flex-direction:column}
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:34px;padding:34px 28px}
.stage-center{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage-note{color:var(--txt2);font-size:12.5px;line-height:1.7;max-width:520px;text-align:center}
.stage-note b{color:var(--txt)}
.hint-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:var(--accent2);font-size:12px}
.hint-pill.green{background:rgba(34,211,170,.1);border-color:rgba(34,211,170,.3);color:var(--accent)}
.hint-pill svg{width:13px;height:13px}

/* ===== 安卓设备壳 ===== */
android-device{--frame-bg:#0b0f16}
.app-shell{width:100%;height:100%;display:flex;flex-direction:column;
  background:
    radial-gradient(600px 300px at 50% -20%, rgba(34,211,170,.1), transparent 60%),
    var(--bg2);
}
/* 进度轨道 */
.progress-rail{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.progress-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.progress-title{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--txt2);display:flex;align-items:center;gap:8px}
.progress-title svg{width:14px;height:14px;color:var(--accent)}
.progress-count{font:600 12px/1 "Rajdhani","Noto Sans SC";color:var(--accent)}
.track{display:flex;gap:0;position:relative;height:26px;align-items:center}
.track-dot{position:relative;flex:1;display:flex;align-items:center}
.track-dot::before{content:"";flex:1;height:2px;background:var(--line2);margin:0 1px}
.track-dot:first-child::before{visibility:hidden}
.track-dot i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;border-radius:50%;background:var(--panel2);
  border:2px solid var(--line2);z-index:2;transition:.25s}
.track-dot.done i{background:var(--accent);border-color:var(--accent)}
.track-dot.done::before{background:var(--accent)}
.track-dot.cur i{width:17px;height:17px;background:transparent;border:2px solid var(--accent2);
  box-shadow:0 0 0 4px rgba(56,189,248,.14), 0 0 14px rgba(56,189,248,.5)}
.track-dot.cur::before{background:var(--accent2)}
.track-dot.fail i{background:var(--danger);border-color:var(--danger)}
.track-dot i svg{width:8px;height:8px;color:#062019;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none}
.track-dot.done i svg{display:block}
/* 进度轨道节点可点击 */
.track-dot.review{cursor:pointer}
.track-dot.review:hover i{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 5px rgba(56,189,248,.18)}
.track-dot.review:hover::after{content:attr(data-tip);position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:10px;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);
  padding:3px 9px;border-radius:7px;z-index:20}
/* 设置入口 */
.top-actions{display:flex;align-items:center;gap:8px;margin-left:10px}
.icon-btn{border:0;background:var(--panel);color:var(--txt2);width:34px;height:34px;border-radius:10px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:.2s;box-shadow:inset 0 0 0 1px var(--line)}
.icon-btn:hover{color:var(--accent);box-shadow:inset 0 0 0 1px rgba(34,211,170,.45)}
.icon-btn svg{width:16px;height:16px}
.help-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:rgba(56,189,248,.12);
  color:var(--accent2);font:600 11px/1 "Noto Sans SC";padding:6px 11px;border-radius:8px;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.3);transition:.2s}
.help-btn:hover{background:rgba(56,189,248,.22)}
.help-btn svg{width:12px;height:12px}
.help-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
/* 通用弹层 */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(3,8,16,.66);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex}
.modal{width:100%;max-width:400px;max-height:82vh;overflow-y:auto;background:var(--bg2);
  border:1px solid var(--line2);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);
  animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.modal h3 svg{width:17px;height:17px;color:var(--accent)}
.modal .m-sub{font-size:11.5px;color:var(--txt3);margin-bottom:16px}
.modal .m-close{position:absolute;top:14px;right:14px;border:0;background:var(--panel2);color:var(--txt2);
  width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px}
.help-step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.help-step:first-of-type{border-top:0}
.hs-ico{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(56,189,248,.12);color:var(--accent2)}
.hs-ico svg{width:14px;height:14px}
.hs-body b{font-size:12.5px;color:var(--txt);display:block;margin-bottom:3px}
.hs-body span{font-size:11.5px;color:var(--txt2);line-height:1.65;display:block}
.hs-body .hs-link{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline}
.hs-body .hs-link svg{width:11px;height:11px}
.confirm-msg{font-size:12.5px;color:var(--txt2);line-height:1.75;margin-bottom:18px}
.confirm-msg b{color:var(--warn)}
.m-btn-row{display:flex;gap:10px;justify-content:flex-end}
.m-btn-row .btn{padding:11px 18px;font-size:13px;border-radius:10px}
/* 设置面板 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .s-t b{font-size:13px;color:var(--txt);display:block}
.set-row .s-t span{font-size:11px;color:var(--txt3);display:block;margin-top:2px}
.set-row .s-a{font-size:11.5px;color:var(--txt3)}
.set-link{border:0;background:rgba(56,189,248,.1);color:var(--accent2);font:600 12px/1 "Noto Sans SC";
  padding:8px 13px;border-radius:9px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(56,189,248,.3)}
.set-link:hover{background:rgba(56,189,248,.2)}
.set-link.danger{background:rgba(248,113,113,.1);color:var(--danger);box-shadow:inset 0 0 0 1px rgba(248,113,113,.35)}
/* 胸口屏同步条 */
.chest-sync{display:flex;align-items:center;gap:9px;padding:8px 16px;background:rgba(15,23,42,.55);
  border-bottom:1px solid var(--line);font-size:11px;color:var(--txt2)}
.chest-sync .cs-ico{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:rgba(34,211,170,.14);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
.chest-sync .cs-ico svg{width:13px;height:13px}
.chest-sync .cs-txt{flex:1;line-height:1.5}
.chest-sync .cs-txt b{color:var(--txt)}
.chest-sync .cs-state{flex:0 0 auto;font-size:10px;color:var(--accent2);background:rgba(56,189,248,.12);
  padding:3px 9px;border-radius:7px}
/* 退出向导按钮 */
.exit-btn{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--txt3);
  font:500 11px/1 "Noto Sans SC";cursor:pointer;padding:5px 8px;border-radius:7px;transition:.2s}
.exit-btn:hover{color:var(--txt);background:var(--panel2)}
.exit-btn svg{width:12px;height:12px}
/* 失败排查 */
.trouble-card{margin-top:12px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.07);
  border-radius:12px;padding:13px 14px}
.trouble-card .t-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#fca5a5;margin-bottom:9px}
.trouble-card .t-title svg{width:13px;height:13px}
.trouble-item{display:flex;gap:8px;font-size:11.5px;color:var(--txt2);line-height:1.6;padding:4px 0}
.trouble-item .ti-no{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:rgba(248,113,113,.18);
  color:#fca5a5;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
/* 未完成标记 */
.pending-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pending-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#fca5a5;
  background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);padding:4px 9px;border-radius:8px}
.pending-chip svg{width:10px;height:10px}
.rc-pending{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.rc-pending .rp-title{font-size:12px;font-weight:600;color:var(--warn);margin-bottom:4px}

/* APP 内容区 */
.app-body{flex:1;overflow-y:auto;padding:20px 20px 12px}
.app-body::-webkit-scrollbar{width:0}
.screen{display:none;animation:fadeUp .28s ease}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 通用APP UI */
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.eyebrow svg{width:12px;height:12px}
.h1{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:8px}
.h2{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:6px}
.body-copy{font-size:12.5px;line-height:1.75;color:var(--txt2)}
.body-copy b{color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:12px;padding:14px 22px;
  font:600 14px/1 "Noto Sans SC";cursor:pointer;transition:.18s;
  background:linear-gradient(135deg,#16a085,#0d9488);color:#03221c}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px rgba(56,189,248,.5);color:var(--accent2)}
.btn.blue{background:linear-gradient(135deg,#0284c7,#0369a1);color:#eaf6ff}
.btn.danger{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:9px}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row.space{justify-content:space-between}

/* 底部导航栏 */
.app-footer{padding:10px 20px 16px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,transparent,rgba(11,18,32,.6))}
.foot-status{font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:7px;line-height:1.4}
.foot-status svg{width:13px;height:13px}
.foot-status.ok{color:var(--accent)}
.foot-status.cur{color:var(--accent2)}
.foot-status b{font-weight:600}

/* 卡片与清单 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.check-item{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.check-item:last-child{border-bottom:0}
.check-box{width:21px;height:21px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line2);
  display:grid;place-items:center;margin-top:1px;cursor:pointer;transition:.2s}
.check-box.on{background:var(--accent);border-color:var(--accent)}
.check-box.on svg{display:block}
.check-box svg{width:12px;height:12px;color:#062019;display:none}
.check-item .ci-body{flex:1}
.check-item .ci-title{font-size:13.5px;font-weight:600;margin-bottom:3px}
.check-item .ci-desc{font-size:11.5px;color:var(--txt2);line-height:1.6}
.ci-step{font:700 12px/1 "Rajdhani";color:var(--accent);margin-right:2px}

/* 自检 */
.diag-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;transition:.25s}
.diag-ico{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:var(--panel2);display:grid;place-items:center}
.diag-ico svg{width:18px;height:18px;color:var(--txt3)}
.diag-item.run .diag-ico svg{color:var(--accent2);animation:pulse 1s infinite}
.diag-item.ok{border-color:rgba(34,211,170,.4);background:rgba(34,211,170,.06)}
.diag-item.ok .diag-ico{background:rgba(34,211,170,.14)}
.diag-item.ok .diag-ico svg{color:var(--accent)}
.diag-item.err{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.07)}
.diag-item.err .diag-ico svg{color:var(--danger)}
.diag-name{font-size:13px;font-weight:600;flex:1}
.diag-state{font-size:11px;color:var(--txt3)}
.diag-item.ok .diag-state{color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 配网（胸口屏 + 手机） */
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.chest-screen{border-radius:12px;border:1px solid var(--line2);overflow:hidden;background:#04070c}
.chest-top{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(120,160,200,.12);font-size:9.5px;color:var(--txt3);letter-spacing:.08em}
.chest-top .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.chest-body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 12px;min-height:150px;text-align:center}
.chest-body .qr{width:74px;height:74px;background:#fff;border-radius:6px;display:grid;place-items:center}
.chest-body .qr svg{width:60px;height:60px}
.chest-msg{font-size:11px;color:var(--txt2);line-height:1.5}
.chest-msg b{color:var(--txt);font-weight:600}
.chest-step{font-size:9.5px;color:var(--txt3);letter-spacing:.1em}
.wifi-list{display:flex;flex-direction:column;gap:6px;width:100%}
.wifi-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;cursor:pointer;transition:.15s}
.wifi-item:hover{border-color:var(--accent2)}
.wifi-item .w-ico{color:var(--txt3)}
.wifi-item .w-ico svg{width:15px;height:15px}
.wifi-item .w-name{flex:1;font-weight:500}
.wifi-item .w-lock svg{width:12px;height:12px;color:var(--txt3)}
.wifi-item.sel{border-color:var(--accent);background:rgba(34,211,170,.08)}
.input{border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--txt);
  padding:13px 14px;font:500 14px/1 "Noto Sans SC";width:100%;outline:none;transition:.2s}
.input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
.input::placeholder{color:var(--txt3)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--txt2);margin-bottom:6px;letter-spacing:.04em}
.field label b{color:var(--txt)}
.progress-line{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:12px 0}
.progress-line i{display:block;height:100%;width:0%;border-radius:99px;transition:.5s ease;
  background:linear-gradient(90deg,#0d9488,#22d3aa)}
.progress-line i.blue{background:linear-gradient(90deg,#0369a1,#38bdf8)}

/* 场景卡片 */
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.scene-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);cursor:pointer;transition:.2s}
.scene-card:hover{border-color:var(--line2)}
.scene-card.sel{border-color:var(--accent);background:rgba(34,211,170,.07);box-shadow:0 0 0 1px var(--accent)}
.scene-card .sc-ico{width:32px;height:32px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;margin-bottom:9px}
.scene-card .sc-ico svg{width:17px;height:17px;color:var(--accent2)}
.scene-card .sc-name{font-size:13px;font-weight:600;margin-bottom:3px}
.scene-card .sc-desc{font-size:10.5px;color:var(--txt2);line-height:1.5}
.scene-card .sc-tag{display:inline-block;margin-top:8px;font-size:9.5px;color:var(--txt3);letter-spacing:.06em}

/* 定位 */
.loc-ring{position:relative;width:132px;height:132px;margin:6px auto}
.loc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.loc-ring .ring-bg{fill:none;stroke:var(--panel2);stroke-width:9}
.loc-ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;transition:1.2s ease}
.loc-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.loc-num .n{font:700 30px/1 "Rajdhani";color:var(--accent)}
.loc-num .l{font-size:10px;color:var(--txt3);letter-spacing:.1em}
.loc-ok{display:none;align-items:center;gap:8px;margin-top:12px;color:var(--accent);font-size:12.5px;font-weight:600}
.loc-ok.on{display:flex}

/* 导航测试 */
.nav-map{position:relative;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);height:220px;overflow:hidden;margin:12px 0}
.nav-map .grid-dot{position:absolute;width:1px;height:1px;background:rgba(120,160,200,.14)}
.nav-robot{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--panel2);
  border:2px solid var(--accent);display:grid;place-items:center;transition:left 2.2s ease,top 2.2s ease;
  box-shadow:0 0 18px rgba(34,211,170,.35)}
.nav-robot svg{width:18px;height:18px;color:var(--accent)}
.nav-point{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--accent2);
  border:2px solid #0b1220;box-shadow:0 0 10px rgba(56,189,248,.6)}
.nav-point::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(56,189,248,.5)}
.nav-path{position:absolute;height:2px;background:repeating-linear-gradient(90deg,rgba(56,189,248,.8) 0 6px,transparent 6px 12px);
  border-radius:2px;opacity:0;transition:opacity .3s}
.nav-path.on{opacity:1}
.nav-tag{position:absolute;font-size:10px;color:var(--txt2);transform:translateY(15px)}
.nav-status{position:absolute;top:10px;right:10px;font-size:10.5px;padding:5px 10px;border-radius:99px;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);color:var(--accent2)}
.nav-status.ok{background:rgba(34,211,170,.12);border-color:rgba(34,211,170,.4);color:var(--accent)}

/* 安全配置 */
.safe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.safe-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.safe-card .sc-ico{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;margin-bottom:8px}
.safe-card .sc-ico svg{width:16px;height:16px;color:var(--warn)}
.safe-card .sc-name{font-size:12.5px;font-weight:600;margin-bottom:3px}
.safe-card .sc-desc{font-size:10.5px;color:var(--txt2);line-height:1.5;margin-bottom:9px}
.toggle{position:relative;width:40px;height:22px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;transition:.2s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--txt3);transition:.2s}
.toggle.on{background:rgba(34,211,170,.3);border-color:var(--accent)}
.toggle.on::after{left:20px;background:var(--accent);box-shadow:0 0 8px rgba(34,211,170,.6)}
.estop{width:100%;height:86px;border-radius:14px;border:0;cursor:pointer;font:700 14px/1.3 "Noto Sans SC";
  background:radial-gradient(circle at 30% 20%, #f87171, #b91c1c);color:#fff;
  box-shadow:0 8px 20px rgba(185,28,28,.4), inset 0 1px 0 rgba(255,255,255,.25);
  transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.estop:active{transform:scale(.97)}
.estop small{font-size:10px;opacity:.85;font-weight:400}
.estop.fine{background:radial-gradient(circle at 30% 20%, #4ade80, #16a34a);box-shadow:0 8px 20px rgba(22,163,74,.35), inset 0 1px 0 rgba(255,255,255,.25)}

/* 总结清单 */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.summary-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.summary-item .s-ico{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--panel2);display:grid;place-items:center}
.summary-item .s-ico svg{width:13px;height:13px;color:var(--txt3)}
.summary-item.ok{border-color:rgba(34,211,170,.35);background:rgba(34,211,170,.05)}
.summary-item.ok .s-ico svg{color:var(--accent)}
.summary-item.skip{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05)}
.summary-item.skip .s-ico svg{color:var(--warn)}
.summary-item .s-name{font-size:11px;font-weight:500;flex:1;line-height:1.3}
.summary-item .s-st{font-size:9.5px;color:var(--txt3)}
.summary-item.ok .s-st{color:var(--accent)}

/* 一键开始工作 */
.golive-steps{margin:12px 0}
.gl-step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;opacity:.45;transition:.3s}
.gl-step.run{opacity:1;border-color:rgba(56,189,248,.45)}
.gl-step.done{opacity:1;border-color:rgba(34,211,170,.4);background:rgba(34,211,170,.06)}
.gl-num{width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font:700 12px/1 "Rajdhani";background:var(--panel2);color:var(--txt3);transition:.3s}
.gl-step.done .gl-num{background:var(--accent);color:#062019}
.gl-step.run .gl-num{background:rgba(56,189,248,.2);color:var(--accent2);animation:pulse 1s infinite}
.gl-name{font-size:12.5px;font-weight:600;flex:1}
.gl-desc{font-size:10.5px;color:var(--txt3);margin-top:2px}
.gl-state{font-size:10.5px;color:var(--txt3)}
.gl-step.done .gl-state{color:var(--accent)}
.gl-step.run .gl-state{color:var(--accent2)}
.gl-check{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;font-size:11.5px;opacity:.45}
.gl-check.done{opacity:1;border-color:rgba(34,211,170,.35);color:var(--txt)}
.gl-check .gc-ico{width:18px;height:18px;border-radius:6px;background:var(--panel2);display:grid;place-items:center}
.gl-check.done .gc-ico{background:var(--accent)}
.gl-check.done .gc-ico svg{color:#062019}
.gl-check .gc-ico svg{width:11px;height:11px;color:var(--txt3);display:none}
.gl-check.done .gc-ico svg{display:block}

/* 完成页 */
.done-hero{text-align:center;padding:26px 0 10px}
.done-ring{width:104px;height:104px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, rgba(34,211,170,.28), rgba(13,148,136,.12));
  border:1px solid rgba(34,211,170,.4);box-shadow:0 0 34px rgba(34,211,170,.25)}
.done-ring svg{width:46px;height:46px;color:var(--accent)}
.done-title{font-size:20px;font-weight:700;margin-bottom:8px}
.done-sub{font-size:12.5px;color:var(--txt2);line-height:1.7;margin-bottom:18px}
.report-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;text-align:left}
.report-card .rc-title{font-size:11px;color:var(--txt3);letter-spacing:.1em;margin-bottom:10px}
.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--line)}
.report-row:last-child{border-bottom:0}
.report-row .k{color:var(--txt2)}
.report-row .v{font-weight:600}

/* ===== 浏览器窗（地图平台） ===== */
browser-window{--frame-bg:#0b0f16;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.map-shell{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg2);font-size:12.5px}
.map-topbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.map-logo{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--txt);flex:0 0 auto}
.map-logo .ml-mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#0e2a33,#0b1220);border:1px solid rgba(34,211,170,.4);display:grid;place-items:center}
.map-logo .ml-mark svg{width:13px;height:13px;color:var(--accent)}
.map-addr{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:11.5px;color:var(--txt2)}
.map-addr svg{width:13px;height:13px;color:var(--accent)}
.map-user{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt2)}
.map-user .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0d9488,#0369a1);display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.map-main{flex:1;display:flex;min-height:0}
.map-tools{width:150px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.map-tool{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;font-size:11.5px;color:var(--txt2);transition:.15s;background:transparent;text-align:left;width:100%}
.map-tool svg{width:15px;height:15px;flex:0 0 auto}
.map-tool:hover{background:var(--panel2);color:var(--txt)}
.map-tool.on{background:rgba(34,211,170,.1);border-color:rgba(34,211,170,.35);color:var(--accent)}
.map-tool.on svg{color:var(--accent)}
.map-tool .mt-note{font-size:9.5px;color:var(--txt3);display:block;margin-left:24px}
.tool-sep{height:1px;background:var(--line);margin:6px 2px}
.map-canvas{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(500px 300px at 80% 10%, rgba(56,189,248,.05), transparent), var(--bg)}
.map-canvas svg{position:absolute;inset:0;width:100%;height:100%}
.map-status{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;z-index:5}
.map-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:10.5px;
  background:rgba(11,18,32,.85);border:1px solid var(--line2);color:var(--txt2);backdrop-filter:blur(4px)}
.map-chip b{color:var(--accent);font-weight:600}
.map-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.map-chip.blue .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.map-chip.blue b{color:var(--accent2)}
.map-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:99px;background:rgba(11,18,32,.9);border:1px solid var(--line2);
  font-size:11.5px;color:var(--txt2);backdrop-filter:blur(6px);white-space:nowrap}
.map-hint b{color:var(--accent2);font-weight:600}
.map-side{width:210px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto}
.side-title{font-size:10.5px;color:var(--txt3);letter-spacing:.1em;margin-bottom:10px}
.side-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:11.5px;border-bottom:1px dashed var(--line)}
.side-row .k{color:var(--txt2)}
.side-row .v{font-weight:600;display:flex;align-items:center;gap:5px}
.side-row .v .swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
.side-row.warn .v{color:var(--warn)}
.side-row.ok .v{color:var(--accent)}
.point-list{margin-top:4px}
.pt-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-bottom:5px;font-size:11px}
.pt-item .p-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pt-item .p-name{flex:1;color:var(--txt2)}
.pt-item .p-xy{font:600 10px/1 "Rajdhani";color:var(--txt3)}
.map-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--txt3)}
.map-footer .mf-right{display:flex;gap:8px;align-items:center}
.map-footer .btn.sm{padding:7px 13px;font-size:11px}

/* 阶段引导跳转卡 */
.jump-card{background:linear-gradient(135deg, rgba(56,189,248,.09), rgba(34,211,170,.06));
  border:1px dashed rgba(56,189,248,.45);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
.jump-card .jc-ico{width:44px;height:44px;border-radius:12px;margin:0 auto 10px;background:rgba(56,189,248,.14);
  display:grid;place-items:center;border:1px solid rgba(56,189,248,.4)}
.jump-card .jc-ico svg{width:22px;height:22px;color:var(--accent2)}
.jump-card .jc-title{font-size:14px;font-weight:600;margin-bottom:5px}
.jump-card .jc-desc{font-size:11.5px;color:var(--txt2);line-height:1.6;margin-bottom:12px}
.jump-card.done{border-color:rgba(34,211,170,.5);background:rgba(34,211,170,.07)}
.jump-card.done .jc-ico{background:rgba(34,211,170,.16);border-color:var(--accent)}
.jump-card.done .jc-ico svg{color:var(--accent)}

/* toast */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:99;
  display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:12px;font-size:12.5px;font-weight:500;
  background:var(--panel2);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.45);
  opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px}
.toast.ok svg{color:var(--accent)}
.toast.info svg{color:var(--accent2)}
.toast.warn svg{color:var(--warn)}

/* 视图切换动画 */
.view-swap{animation:viewIn .35s ease}
@keyframes viewIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* 响应式 */
@media (max-width: 980px){
  .stage-wrap{flex-direction:column;gap:22px;padding:20px 14px}
  .stage-note{max-width:100%}
  .tagline{display:none}
}
@media (max-width: 640px){
  .topbar{padding:12px 14px;flex-wrap:wrap}
  .brand-name{font-size:13px}
  .tabs{width:100%;margin-left:0}
  .tab{flex:1;justify-content:center}
  .pair-grid,.scene-grid,.safe-grid,.summary-grid{grid-template-columns:1fr}
}
/* 横屏向导：左侧示意，右侧单步操作 */
#view-app .stage-wrap{padding:28px 20px;display:block}
#view-app .stage-center{display:none}
.landscape-device{width:min(960px,100%);height:540px;margin:auto;border:8px solid #182231;border-radius:26px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.3)}
.progress-rail{padding:16px 24px 8px}
.progress-head{margin-bottom:6px}
.help-wrap{position:absolute;right:28px;top:14px;gap:12px}
.progress-rail{position:relative}
.progress-count{margin-right:190px}
#chest-sync,.foot-status{display:none}
.app-body{padding:24px 36px;min-height:0}
.app-footer{padding:12px 24px;justify-content:flex-end}
.app-shell.connecting .track,.app-shell.connecting .app-footer,.app-shell.connecting .progress-count{display:none}
.app-shell.connecting .app-body{display:flex;align-items:center}
.connect-hero{display:grid!important;grid-template-columns:240px minmax(0,1fr);gap:44px;align-items:center;width:100%;text-align:left}
.connect-orbit{width:190px;height:190px;display:grid;place-items:center;background:var(--panel2);border-radius:50%;margin:auto}
.connect-orbit svg{width:84px;height:84px;color:var(--accent2)}
.connect-hero .h1{font-size:28px;margin-bottom:12px}
.connect-hero .body-copy{font-size:15px;line-height:1.7}
.connect-device{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--txt);cursor:pointer;margin-top:12px;min-height:56px}
.connect-device svg{width:28px;height:28px;color:var(--accent)}
.connect-actions{display:flex;gap:12px;margin-top:24px}
.connect-actions .btn{min-height:44px}
.connect-orbit.searching{animation:connect-pulse 1.5s ease-in-out infinite}
@keyframes connect-pulse{50%{box-shadow:0 0 0 16px rgba(56,189,248,.08)}}
@media(max-width:700px){
  #view-app .stage-wrap{padding:12px 8px}
  .landscape-device{height:440px;border-width:4px;border-radius:18px}
  .app-body{padding:18px}
  .connect-hero{grid-template-columns:120px minmax(0,1fr);gap:20px}
  .connect-orbit{width:110px;height:110px}
  .connect-orbit svg{width:54px;height:54px}
  .connect-hero .h1{font-size:23px}
  .help-wrap{right:12px}
  .progress-count{margin-right:160px}
}
@media(prefers-reduced-motion:reduce){.connect-orbit.searching{animation:none}}

.device-caption{width:min(1000px,100%);margin:0 auto 12px;display:flex;justify-content:space-between;color:var(--txt2);font-size:12px;gap:12px}
.device-caption select{background:var(--panel);color:var(--txt);border:1px solid var(--line2);padding:5px;border-radius:6px}
.landscape-device{position:relative;width:min(1000px,100%);height:min(610px,calc(100vh - 180px));min-height:500px;padding:0 14px 12px 24px;border:3px solid #526071;border-radius:34px;background:#202833;box-shadow:inset 0 0 0 4px #111721,0 20px 70px #0006}
.device-camera{position:absolute;left:7px;top:50%;width:8px;height:8px;background:#05090d;border:1px solid #465665;border-radius:50%}
.device-status{height:28px;padding:6px 18px;display:flex;justify-content:space-between;font-size:11px;color:#e6eef5}
.app-shell{height:calc(100% - 28px);border-radius:12px;overflow:hidden}
.app-nav{display:flex;gap:24px;padding:10px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.app-nav button{border:0;background:none;color:var(--txt2);min-height:44px;font:inherit;font-size:14px;cursor:pointer}
.app-nav .active{color:var(--accent)}
.app-shell.connecting .progress-rail{display:none}
.mobile-field{display:block;margin:16px 0;font-size:14px;color:var(--txt2)}
.mobile-field .input{display:block;width:100%;margin-top:8px;min-height:44px;font-size:16px}
.mobile-check{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:14px;color:var(--txt2);min-height:28px}
.mobile-check input{width:18px;height:18px;accent-color:var(--accent)}
.form-error{color:var(--danger);font-size:13px;min-height:20px;margin:8px 0}
.control-layout,.settings-columns{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:16px}
.mode-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mode-buttons .selected{border-color:var(--accent);color:var(--accent)}
.control-status{color:var(--accent);font-size:14px}
.vision-preview{height:150px;background:#050a10;border:1px solid var(--line2);border-radius:12px;display:grid;place-items:center;color:var(--txt2);font-size:13px;margin:12px 0}
.control-layout details{font-size:13px;color:var(--warn);line-height:1.7}
.control-layout summary{cursor:pointer;padding:8px 0}
.app-shell.connecting .app-body:has(.control-layout),.app-shell.connecting .app-body:has(.settings-columns){display:block}
@media(max-width:700px){.landscape-device{height:520px;padding-left:18px}.connect-hero{grid-template-columns:100px 1fr;gap:14px}.control-layout,.settings-columns{gap:16px}.app-nav{gap:16px;padding:6px 16px}}
.robot-map-preview{height:230px;margin:14px 0;background:#080f19;border:1px solid var(--line2);border-radius:12px;overflow:hidden}.robot-map-preview svg{width:100%;height:100%}

.topbar .tabs,.topbar .top-actions,.topbar .meta{display:none}
.app-shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:54px auto minmax(0,1fr) auto}
.mobile-header{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);gap:12px}
.mobile-header b{font-size:15px}.mobile-header>div{display:flex;align-items:center;gap:14px}#robot-info{font-size:12px;color:var(--txt2)}
#mobile-settings{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;width:44px;height:40px;font-size:22px;cursor:pointer}
.app-nav{display:none}.progress-rail{grid-column:1;grid-row:2}.app-body{grid-column:1;grid-row:3;overflow:auto}.app-footer{grid-column:1;grid-row:4}
.app-shell.connecting{grid-template-rows:54px minmax(0,1fr)}.app-shell.connecting .app-body{grid-row:2}

class EmergencyStop {
  constructor(){this.stopped=false;}
  mount(visible){
    const host=$('#emergency-control'),t=(zh,en)=>robotConnection.t(zh,en);
    host.hidden=!visible;
    if(!visible){host.innerHTML='';return;}
    host.innerHTML=`<div class="emergency-slider ${this.stopped?'stopped':''}"><span>${t(this.stopped?'急停中':'滑动急停 →',this.stopped?'Emergency stopped':'Slide to stop →')}</span>${this.stopped?'':`<button type="button" role="slider" aria-label="${t('滑动急停','Slide to emergency stop')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">→</button>`}</div>`;
    const track=host.firstElementChild,handle=track.querySelector('button');
    if(!handle)return;
    let value=0,start=0,pointer=null;
    const set=v=>{value=Math.max(0,Math.min(100,v));track.style.setProperty('--slide',value/100);handle.setAttribute('aria-valuenow',Math.round(value));};
    const finish=()=>{if(value>=95)this.activate();else set(0);};
    handle.onpointerdown=e=>{if(pointer!==null||e.button!==0)return;e.preventDefault();pointer=e.pointerId;start=e.clientX;handle.setPointerCapture(pointer);};
    handle.onpointermove=e=>{if(e.pointerId===pointer)set((e.clientX-start)/(track.clientWidth-handle.offsetWidth-6)*100);};
    handle.onpointerup=e=>{if(e.pointerId!==pointer)return;pointer=null;finish();};
    handle.onpointercancel=handle.onlostpointercapture=()=>{pointer=null;set(0);};
    handle.onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End','Enter',' '].includes(e.key))return;e.preventDefault();if(['Enter',' '].includes(e.key)){finish();return;}set(e.key==='End'?100:e.key==='Home'?0:value+(e.key==='ArrowRight'?10:-10));};
    handle.onblur=()=>{if(pointer===null)set(0);};
  }
  activate(){
    if(this.stopped)return;
    this.stopped=true;robotConnection.enabled=false;robotConnection.visual=false;
    renderStage();toast(robotConnection.t('机器人急停中（模拟）','Robot emergency stopped (simulated)'),'warn');
  }
  lockControls(){
    if(!this.stopped)return;
    bodyEl.querySelectorAll('[data-posture],[data-mode],[data-workmode],#save-operating-mode,#enable-control,#send-action,#toggle-vision,[data-joint],[data-angle],[data-grip],[data-head],[data-height],[data-base],#angular-speed,#linear-speed,#direction-lock').forEach(el=>{
      el.disabled=true;
      ['onclick','oninput','onpointerdown','onkeydown','onpointerup','onkeyup','onblur'].forEach(event=>{el[event]=null;});
    });
    const feedback=$('#remote-feedback');
    if(feedback)feedback.textContent=robotConnection.t('急停中 · 动作控制已禁用（模拟）','Emergency stopped · Motion controls disabled (simulated)');
  }
}

class RobotConnection {

  reset(){ clearTimeout(this.timer); this.phase='language'; this.ready=false; this.robot=null; this.linked=false; this.page='connect'; this.visual=false; this.voice=false; this.enabled=false; }
  t(zh,en){ return this.en?en:zh; }
  set(phase){
    clearTimeout(this.timer);this.phase=phase;

    if(phase==='selfcheck'){appState.diag=[false,false,false,false];appState.done[2]=false;}
    renderStage();

    this.timer=setTimeout(()=>{
      if(this.phase!=='selfcheck')return;
      appState.diag[index]=true;
      if(index===3){appState.done[2]=true;saveProgress();}
      const row=bodyEl.querySelector(`[data-diag="${index}"]`);
      if(row){row.classList.add('ok');row.querySelector('.diag-state').textContent='正常';}

      if(index<3)this.runDiagnostics(index+1);
    },650);
  }

    });
    this.bindRemote();
    on('settings-guide',()=>this.goGuide(13));
    on('start-system-check',()=>{const b=$('#start-system-check');b.disabled=true;b.textContent=t('检测中…','Checking…');this.timer=setTimeout(()=>{if(this.page==='home'){renderStage();toast(t('检测完成：1 项异常（模拟）','Check complete: 1 fault (simulated)'),'warn');}},900);});
    on('language-next',()=>{appState.done[13]=true;this.goGuide(0);});
    bodyEl.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{if(b.dataset.home==='guide'){this.goGuide(appState.stage);return;}else this.page=b.dataset.home;renderStage();});
    on('work-map',()=>openRobotMap(null));
    bodyEl.querySelectorAll('[data-workmode]').forEach(b=>b.onclick=()=>{appState.workMode=b.dataset.workmode;saveProgress();renderStage();});
    bodyEl.querySelectorAll('[data-run-scene]').forEach(b=>b.onclick=()=>{if(appState.runScene!==b.dataset.runScene){appState.done[14]=false;appState.done[12]=false;appState.fin=false;}appState.runScene=b.dataset.runScene;[7,9,10].forEach(id=>appState.skip[id]=appState.runScene==='数采');renderStage();});
    on('save-operating-mode',()=>{this.page='home';renderStage();});
    on('confirm-workmode',()=>{appState.done[14]=true;[7,9,10].forEach(id=>appState.skip[id]=appState.runScene==='数采');saveProgress();this.goGuide(appState.runScene==='数采'?12:7);});
    on('change-workmode',()=>{this.page='mode-settings';renderStage();});
    on('open-wifi-settings',()=>{this.page='wifi-settings';renderStage();});
    on('open-update',()=>{this.page='update';renderStage();});
    on('check-system-update',()=>{const button=$('#check-system-update');button.disabled=true;button.textContent=t('检查中…','Checking…');this.timer=setTimeout(()=>{if(this.page==='update'){button.disabled=false;button.textContent=t('再次检查','Check again');$('#system-update-result').textContent=t('检查完成，暂无可用更新（模拟）。','Check complete. No updates available (simulated).');}},800);});
    on('open-about',()=>{this.page='about';renderStage();});
    on('back-about',()=>{this.page='settings';renderStage();});
    on('back-settings',()=>{clearTimeout(this.timer);this.page='settings';renderStage();});
    const wifiForm=$('#switch-wifi-form');
    if(wifiForm)wifiForm.onsubmit=e=>{
      e.preventDefault();
      const status=$('#wifi-switch-status');
      if($('#demo-bluetooth').value!=='on'){status.textContent=t('请先开启蓝牙权限，再重试切换。','Enable Bluetooth access, then retry.');return;}
      const network=$('#new-wifi').value;
      const failed=$('#demo-result').value==='fail';
      $('#switch-wifi-submit').disabled=true;
      status.textContent=t('正在下发配置并等待机器人接入新网络…（模拟）','Sending settings and waiting for the new network… (simulated)');
      this.timer=setTimeout(()=>{
        if(this.page!=='wifi-settings')return;
        $('#switch-wifi-submit').disabled=false;
        if(failed){status.textContent=t('切换失败，请核对密码并重试。当前网络配置未更新。','Switch failed. Check the password and retry. Current settings are unchanged.');return;}

        $('#new-wifi-password').value='';saveProgress();
        renderStage();$('#wifi-switch-status').textContent=t('切换成功，机器人已重新连接（模拟）。请确保手机也接入同一网络。','Reconnected successfully (simulated). Ensure your phone uses the same network.');
      },1500);
    };
    on('selfcheck-prev',()=>this.goGuide(3));
    on('workmode-prev',()=>this.goGuide(2));
    on('selfcheck-next',()=>this.goGuide(14));
    on('start-search',()=>this.requestBluetooth());
    on('select-robot',()=>this.connect('Galbot-G1-0826'));on('rescan',()=>this.search());on('cancel-search',()=>this.set('intro'));
    on('go-connect',()=>{this.page='connect';renderStage();});
    on('open-control',()=>this.exitGuide());
    on('continue-oobe',()=>{this.ready=true;renderStage();});

    ['lever','standing'].forEach(id=>{if($('#'+id))$('#'+id).onchange=()=>{if(!$('#'+id).checked){this.enabled=false;this.visual=false;renderStage();}};});
    on('toggle-vision',()=>{if(!this.enabled){toast(t('请先启用机器人控制','Enable control first'),'warn');return;}this.visual=!this.visual;renderStage();});
    if($('#voice'))$('#voice').onchange=()=>this.voice=$('#voice').checked;
    on('send-action',()=>{if(!this.enabled){toast(t('请先启用机器人控制','Enable control first'),'warn');return;}showConfirm(t('确认执行动作？','Execute action?'),t('确认半径 4m 内无障碍物，安全绳已预留空间冗余。','Confirm the 4 m radius is clear and the safety rope has sufficient slack.'),()=>{$('#action-status').textContent=t('动作命令已发送（模拟）','Action command sent (simulated)')+(this.voice?t(' · 语音播报已触发（模拟）',' · Voice announcement triggered (simulated)'):'');});});
    if($('#app-language'))$('#app-language').onchange=()=>{this.changeLanguage($('#app-language').value);};
    emergencyStop.lockControls();
  }
  softwareStatus(){
    const t=(zh,en)=>this.t(zh,en),state='error';
    const status=state==='normal'?t('正常','Normal'):state==='error'?t('异常模式','Abnormal mode'):t('待同步','Awaiting sync');
    const group=(title,en,items)=>`<div class="system-group"><h4>${t(title,en)}</h4>${items.map(([zh,en,i])=>{const error=state==='error'&&i===1;const pending=state==='pending';return `<div class="system-row ${error?'fault':''}"><span><i class="system-dot ${pending?'pending':error?'bad':''}"></i>${t(zh,en)}</span><b>${pending?t('待同步','Pending'):error?t('异常','Error'):t('正常','Normal')}</b>${error?`<p>${t('【0x0E020001】左臂相机无配置文件（模拟）','[0x0E020001] Left camera configuration missing (simulated)')}</p>`:''}</div>`;}).join('')}</div>`;
    return `<section class="software-card"><div class="software-heading"><h2>${t('运行监测','Operation monitoring')}</h2><button class="btn blue sm" id="start-system-check">${t('开始检测','Start check')}</button></div><p class="software-note">${t('运行状态为原型演示，实际数据由机器人同步。','Prototype status; actual data will be synchronized from the robot.')}</p><div class="system-groups">${group('相机','Cameras',[['头部相机','Head camera',0],['左臂相机','Left arm camera',1],['右臂相机','Right arm camera',2]])}${group('雷达','LiDAR',[['头部雷达','Head LiDAR',3],['背部雷达','Back LiDAR',4],['底部雷达','Base LiDAR',5]])}${group('其他','Other',[['其他','Other services',6]])}</div></section>`;
  }
  softwareVersions(){return [['HPU','HPU'],['XCU','XCU'],['料箱搬运','Container handling'],['SPS','SPS'],['导航服务','Navigation service'],['定位服务','Localization service']];}
  aboutScreen(){
    const t=(zh,en)=>this.t(zh,en),pending=t('待同步','Awaiting sync');
    const card=(title,en,rows)=>`<section class="about-card"><h3>${t(title,en)}</h3>${rows.map(([zh,en,value])=>`<div class="about-row"><span>${t(zh,en)}</span><b>${value||pending}</b></div>`).join('')}</section>`;
    return `<div class="screen on"><div class="about-heading"><button class="btn ghost sm" id="back-about">← ${t('设置','Settings')}</button><h2>${t('关于本机','About this robot')}</h2></div><div class="about-layout"><div>${card('硬件信息','Hardware information',[['整机型号','Robot model','G1'],['整机版本','Hardware version'],['整机 SN','Serial number','GB1-2026-09941'],['IP 地址','IP address','192.168.0.23']])}${card('软件信息','Software information',this.softwareVersions())}</div><div class="about-robot"><img src="assets/robot-home.png" alt="G1 机器人"><p>${t('SN、IP 为演示数据；版本信息待机器人同步。','SN and IP are demo data. Versions await robot synchronization.')}</p></div></div></div>`;
  }
  remoteScreen(){
    const t=(zh,en)=>this.t(zh,en), r=this.remote;
    const arm=side=>`<section class="remote-panel"><h3>${t(side==='left'?'左臂':'右臂',side==='left'?'Left arm':'Right arm')}</h3>${r[side].map((value,i)=>`<div class="joint-row"><b>J${i+1}</b><button data-joint="${side}:${i}:-5" aria-label="${side} J${i+1} decrease">−</button><input type="range" min="-180" max="180" value="${value}" data-angle="${side}:${i}" aria-label="${side} J${i+1}"><button data-joint="${side}:${i}:5" aria-label="${side} J${i+1} increase">+</button><output id="angle-${side}-${i}">${value}°</output></div>`).join('')}<div class="grip-row"><b>${t('末端夹爪','Gripper')}</b>${['闭合','张开'].map((v,i)=>`<button class="${r[side+'Grip']===v?'selected':''}" data-grip="${side}:${v}">${t(v,i?'Open':'Close')}</button>`).join('')}</div></section>`;
    return `<div class="remote-screen"><div class="remote-title"><button class="btn ghost" id="remote-back">← ${t('返回','Back')}</button><h2>${t('整机遥控','Whole-body control')}</h2><span>${t('模拟操作','Simulated controls')}</span></div><div class="remote-grid">${arm('left')}<div class="remote-middle"><section class="remote-panel"><h3>${t('头部','Head')}</h3><div class="head-pad">${[['up','↑'],['left','←'],['center','●'],['right','→'],['down','↓']].map(([key,label])=>`<button class="head-${key}" data-head="${key}" aria-label="Head ${key}">${label}</button>`).join('')}</div><p class="remote-value" id="head-value">${r.head[0]}° / ${r.head[1]}°</p></section><section class="remote-panel"><h3>${t('躯干升降','Torso height')}</h3><div class="torso-control"><button data-height="1">▲</button><output id="torso-height">${r.height.toFixed(2)} m</output><button data-height="-1">▼</button></div></section></div>${arm('right')}</div><div class="base-controls"><div class="direction-pad rotation-pad"><span class="stick-center" aria-hidden="true">●</span><button data-base="左转">↶</button><button data-base="右转">↷</button></div><div class="base-options"><label>${t('角速度','Angular speed')}<select id="angular-speed"><option value="0.2">0.2 rad/s</option><option value="0.1">0.1 rad/s</option></select></label><p>${t('遥控前确认 E 拨杆向上、机器人站立，周围无人且无障碍物。','Ensure no people or obstacles are nearby.')}<small>${t('关节范围及数值仅作界面示意。','Joint ranges and values are illustrative.')}</small></p><label>${t('线速度','Linear speed')}<select id="linear-speed"><option value="0.3">0.3 m/s</option><option value="0.1">0.1 m/s</option></select><span class="lock-label"><input id="direction-lock" type="checkbox" checked>${t('四项锁定','Four-direction lock')}</span></label></div><div class="direction-pad movement-pad"><button data-base="前进">↑</button><button data-base="左移">←</button><button data-base="停止">■</button><button data-base="右移">→</button><button data-base="后退">↓</button></div></div><p class="remote-feedback" id="remote-feedback" role="status">${t('等待操作 · 按住底盘方向键，松开停止（模拟）','Ready · Hold a base direction, release to stop (simulated)')}</p></div>`;
  }
  bindRemote(){
    if(this.page!=='remote')return;
    const feedback=msg=>$('#remote-feedback').textContent=msg+'（模拟）';
    const update=(side,i,value)=>{this.remote[side][i]=Math.max(-180,Math.min(180,value));$('#angle-'+side+'-'+i).textContent=this.remote[side][i]+'°';bodyEl.querySelector(`[data-angle="${side}:${i}"]`).value=this.remote[side][i];feedback(side+' J'+(i+1)+'：'+this.remote[side][i]+'°');};
    bodyEl.querySelectorAll('[data-joint]').forEach(b=>b.onclick=()=>{const [side,i,delta]=b.dataset.joint.split(':');update(side,+i,this.remote[side][+i]+Number(delta));});
    bodyEl.querySelectorAll('[data-angle]').forEach(el=>el.oninput=()=>{const [side,i]=el.dataset.angle.split(':');update(side,+i,+el.value);});
    bodyEl.querySelectorAll('[data-grip]').forEach(b=>b.onclick=()=>{const [side,value]=b.dataset.grip.split(':');this.remote[side+'Grip']=value;renderStage();feedback((side==='left'?'左':'右')+'夹爪'+value);});
    bodyEl.querySelectorAll('[data-head]').forEach(b=>b.onclick=()=>{const key=b.dataset.head;if(key==='center')this.remote.head=[0,0];else{const i=['left','right'].includes(key)?0:1;this.remote.head[i]=Math.max(-90,Math.min(90,this.remote.head[i]+(['up','right'].includes(key)?5:-5)));}$('#head-value').textContent=this.remote.head.join('° / ')+'°';feedback('头部方向已调整');});

    $('#app-nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{

    const failed=$('#demo-result').value==='fail';

  }
}

/* ---------- 进度持久化（中途退出后恢复） ---------- */
const SAVE_KEY = 'galbot_oobe_state_v2';
function saveProgress(){
  try{
    const snap = {
      workMode:appState.workMode,
      runScene:appState.runScene,
      stage: appState.stage,
      done: appState.done,
      skip: appState.skip,
      lang: appState.lang,
      unbox: appState.unbox,
      diag: appState.diag,
      net: {...appState.net, pwd:''},
      device: appState.device,
      update: appState.update,
      scene: appState.scene,
      mapStage: {...appState.mapStage, detected:false, detecting:false},
      loc: appState.loc,
      nav: appState.nav,
      safe: appState.safe,
      golive: { checks: appState.golive.checks, steps: appState.golive.steps, finished: appState.golive.finished, tested: appState.golive.tested, _started:false },
      fin: appState.fin,
      _t: Date.now(),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
  }catch(e){ /* 忽略存储失败 */ }
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const snap = JSON.parse(raw);
    if(!snap || typeof snap.stage!=='number') return false;
    Object.assign(appState, snap);
    if(!appState.runScene&&snap.workMode)appState.runScene=snap.workMode==='采集'?'数采':'标准';
    if(appState.golive) appState.golive._started = false;
    return true;
  }catch(e){ return false; }
}
function clearProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function toast(msg, type='ok'){
  const t = $('#toast');
  t.innerHTML = (type==='ok'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>':type==='warn'?ICO.warn:ICO.info) + '<span>'+msg+'</span>';
  t.className = 'toast on ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.className='toast', 2200);
}

/* ---------- 进度轨道渲染 ---------- */
function renderTrack(){
  const groups=activeGroups(),current=groups.findIndex(group=>group.pages.includes(appState.stage));
  trackEl.style.gridTemplateColumns=`repeat(${groups.length},minmax(0,1fr))`;
  trackEl.innerHTML=groups.map((group,index)=>{
    const done=group.pages.every(id=>appState.done[id]),active=index===current;
    const target=active?group.pages.find(id=>!appState.done[id])??group.pages[0]:group.pages[0];
    const label=`第 ${index+1} 步 ${group.name}`;
    return `<div class="track-dot ${active?'cur ':''}${done?'done':''}${done||active?' review':''}" data-review="${target}" data-available="${done||active}" data-tip="${label}${done?' · 已完成，点击回看':''}"><i>${done?ICO.check:''}</i><span class="step-label">${group.name}</span></div>`;
  }).join('');
  countEl.textContent=`第 ${current+1} / ${groups.length} 步`;
  if(robotConnection.linked&&robotConnection.page==='connect'){
    countEl.innerHTML+='<button id="rail-exit" class="rail-exit">退出引导</button>';
    $('#rail-exit').onclick=()=>robotConnection.exitGuide();
  }
  trackEl.querySelectorAll('[data-review]').forEach(node=>node.onclick=()=>{
    if(node.dataset.available==='true')robotConnection.goGuide(+node.dataset.review);
  });
}

function footStatus(){
  const s = STAGES[appState.stage];
  if(appState.done[appState.stage]){
    footEl.className='foot-status ok';
    footEl.innerHTML = ICO.check + ` <b>${s.label} ${s.name}</b> · 已完成`;
  }else if(appState.skip[appState.stage]){
    footEl.className='foot-status cur';
    footEl.innerHTML = ICO.warn + ` <b>${s.label} ${s.name}</b> · 已跳过`;
  }else{
    footEl.className='foot-status cur';
    footEl.innerHTML = ICO.nav + ` 当前步骤：<b>${s.label} ${s.name}</b>`;
  }
}

    ['Stage 8：地图编辑', '标注禁行线、Home 点、取货/放置/充电点。'],
    ['Stage 9：定位校准', '确认定位置信度达标。'],
    ['Stage 10：导航测试', '点到点导航与避障验证。'],
    ['Stage 11：安全配置', '安全监控区、速度限制与急停测试。'],
    ['Stage 12：完成与开始工作', '开始工作前检查 → 一键开始工作 → 首单测试 → 完成。'],
  ][s];
  noteEl.innerHTML = `<b>${mapNote[0]}</b> · ${mapNote[1]}`;

  let html = '';
  switch(s){
    case 0: html = screenUnbox(); break;
    case 1: html = screenWelcome(); break;
    case 2: html = screenDiag(); break;
    case 3: html = screenNet(); break;
    case 5: html = screenUpdate(); break;
    case 6: html = screenScene(); break;
    case 7: case 8: html = screenMapJump(s); break;
    case 9: html = screenLoc(); break;
    case 10: html = screenNav(); break;
    case 11: html = screenSafe(); break;
    case 12: html = screenGolive(); break;
  }
  bodyEl.innerHTML = html.replace(/STAGE \d+/g,STAGES[s].label);
  bindStageEvents();

  // 底部按钮
  btnNext.textContent = '下一步';
  btnNext.disabled = (s===0 && !appState.unbox.every(Boolean)) || (s===2 && !appState.diag.every(Boolean)) || (s===3 && !appState.net.connected) || (s===7 && !appState.mapStage.built);
  btnNext.style.display = s===12 ? 'none' : '';
  btnPrev.style.display = s===12 || stepNumber()===1 ? 'none' : '';
  // 跳过按钮：未完成阶段可跳过（Stage 0 开箱必须完成；Stage 12 开始工作动画可快进）
  const skippable = false;
  if(s===12 && !appState.golive.finished){
    btnSkip.style.display = 'none';
    btnSkip.textContent = '跳过开始工作动画';
  }else{
    btnSkip.style.display = skippable ? '' : 'none';
    btnSkip.textContent = '跳过本步';
  }
}

/* ---------- 阶段事件绑定 ---------- */
function bindStageEvents(){
  const s = appState.stage;
  document.querySelectorAll('[data-manual]').forEach(button=>button.onclick=event=>{event.preventDefault();RobotManual.open(button.dataset.manual);});
  // Stage 0
  document.querySelectorAll('[data-unbox]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.unbox;
      appState.unbox[i] = !appState.unbox[i];
      renderStage();
    });
  });
  // Stage 1 语言
  document.querySelectorAll('[data-lang]').forEach(el=>{
    el.addEventListener('click', ()=>{ appState.lang = el.dataset.lang; renderStage(); });
  });
  // Stage 1 确认开箱勾选
  const wc = $('#welcome-check');
  if(wc) wc.addEventListener('click', ()=>{
    if(!appState.unbox.every(Boolean)){
      appState.unbox = [true,true,true,true];
      appState.done[1] = true;
      renderStage();
      toast('已确认开箱完成','ok');
    }
  });
  // Stage 2 自检（自动跑）
  if(s===2 && !appState.diag.every(Boolean) && !appState._diagRunning){
    appState._diagRunning=true;
    let i = appState.diag.filter(Boolean).length;
    const run = setInterval(()=>{
      if(appState.stage!==2 || !robotConnection.ready){ clearInterval(run); appState._diagRunning=false; return; }
      appState.diag[i] = true;
      i++;
      renderStage();
      if(i>=4){
        clearInterval(run); appState._diagRunning=false;
        setTimeout(()=>{ appState.done[2]=true; renderStage(); }, 500);
      }
    }, 700);
  }
  const networkConnect=$('#network-connect');
  if(networkConnect)networkConnect.onclick=()=>{robotConnection.ready=false;robotConnection.page='connect';robotConnection.set('intro');};
  // 系统更新仅检查，不自动下载或安装。
  const updateCheck=$('#update-check');
  if(updateCheck)updateCheck.onclick=()=>{
    appState.update.checking=true;renderStage();
    setTimeout(()=>{appState.update.checking=false;appState.update.checked=true;appState.done[5]=true;saveProgress();renderStage();},900);
  };
  // Stage 6 场景
  document.querySelectorAll('[data-scene]').forEach(el=>{
    el.addEventListener('click', ()=>{ appState.scene = +el.dataset.scene; renderStage(); });
  });
  if(s===7 && !appState.mapStage.detected && !appState.mapStage.detecting){
    appState.mapStage.detecting=true;
    setTimeout(()=>{
      const hasMap=appState.mapStage.built||MAP.built||$('#demo-map').value==='yes';
      appState.mapStage.detecting=false;appState.mapStage.detected=true;
      if(hasMap){MAP.built=true;MAP.build=100;appState.mapStage.built=true;appState.done[7]=true;}
      saveProgress();
      if(appState.stage!==7 || !robotConnection.ready)return;
      renderStage();
    },900);
  }
  const deferMapping=$('#defer-mapping');
  if(deferMapping)deferMapping.onclick=()=>{[7,9,10].forEach(id=>appState.skip[id]=true);saveProgress();robotConnection.goGuide(12);};
  document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>openRobotMap(+el.dataset.jump));
  // Stage 9 定位（自动动画）
  if(s===9 && appState.loc<96){
    const t = setInterval(()=>{
      if(appState.stage!==9 || !robotConnection.ready){ clearInterval(t); return; }
      appState.loc += 9 + Math.random()*7;
      if(appState.loc>=96){ appState.loc=96; clearInterval(t); setTimeout(()=>{ appState.done[9]=true; renderStage(); }, 800); }
      renderStage();
    }, 420);
  }
  // Stage 10 导航测试
  if(s===10){
    const st = $('#nav-status');
    if(st && !appState.nav.done){
      const robot = $('#nav-robot'), path = $('#nav-path');
      setTimeout(()=>{
        path.style.cssText = 'position:absolute;left:18%;top:22%;width:64%;height:2px;opacity:1';
        robot.style.left = '82%';
        robot.style.top = '58%';
        setTimeout(()=>{
          path.style.cssText = 'position:absolute;left:82%;top:58%;width:8%;height:2px;opacity:0';
          appState.nav.done = true;
          const st2 = $('#nav-status');
          if(st2){ st2.className='nav-status ok'; st2.textContent='测试通过'; }
          setTimeout(()=>{ appState.done[10] = true; renderStage(); }, 900);
        }, 2400);
      }, 900);
    }
  }
  // Stage 11 安全
  if(s===11){
    const z = $('#safe-zone'); if(z) z.addEventListener('click', ()=>{ appState.safe.zone = !appState.safe.zone; renderStage(); });
    const spd = $('#safe-speed'); if(spd) spd.addEventListener('click', ()=>{ appState.safe.speed = !appState.safe.speed; renderStage(); });
    const e = $('#safe-estop');
    if(e) e.addEventListener('click', ()=>{
      if(!appState.safe.estop){
        appState.safe.estopPressed = true;
        e.innerHTML = ICO.estop + '<span>急停已触发 · 机器人已制动</span><small>再次点击复位</small>';
        setTimeout(()=>{
          appState.safe.estop = true;
          appState.done[11] = true;
          renderStage();
          toast('急停测试通过','ok');
        }, 1300);
      }
    });
  }
  const startWork=$('#guide-start-work');
  if(startWork)startWork.onclick=()=>{
    appState.golive.finished=true;appState.done[12]=true;appState.fin=true;saveProgress();robotConnection.linked=true;robotConnection.exitGuide();
  };
}

/* ---------- 上一步 / 下一步 ---------- */
function next(){
  if(!robotConnection.ready) return;
  const s = appState.stage;
  if(s===0 && !appState.unbox.every(Boolean)) return;
  if(s===2 && !appState.diag.every(Boolean)) return;
  if(s===3 && !appState.net.connected) return;
  if(s===7 && !appState.mapStage.built) return;
  // 标记当前完成（若未标记）
  if(!appState.done[s] && !appState.skip[s]){
    // Stage 有完成条件的在各自逻辑里标记；这里兜底
    if(s===1 && !appState.unbox.every(Boolean)){ toast('请先确认开箱完成','warn'); return; }
    if(s===6 && appState.scene===null){ toast('请先选择业务场景','warn'); return; }
    if(s===12 && !appState.golive.finished){ toast('请等待一键开始工作流程完成','warn'); return; }
    appState.done[s] = true;
  }
  if(s!==12){
    moveStage();
    appState.golive._started = false;
    robotConnection.goGuide(appState.stage);
  }
}
function prev(){
  if(stepNumber()>1){
    moveStage(-1);
    appState.golive._started = false;
    robotConnection.goGuide(appState.stage);
  }
}
btnNext.addEventListener('click', next);
btnPrev.addEventListener('click', prev);
/* 跳过当前阶段（二次确认） */
btnSkip.addEventListener('click', ()=>{
  const s = appState.stage;
  const st = STAGES[s];
  if(s===12 && !appState.golive.finished){
    showConfirm('跳过开始工作动画？', `跳过将直接标记 <b>${st.name}</b> 为完成，不展示开始工作过程动画。可在部署报告查看结果。`, ()=>{
      appState.golive.checks = appState.golive.checks.map(()=>true);
      appState.golive.steps = appState.golive.steps.map(()=>true);
      appState.golive.finished = true;
      appState.done[12] = true;
      appState.fin = true;
      saveProgress();
      renderStage();
      toast('已跳过开始工作动画，标记为完成','info');
    });
    return;
  }
  showConfirm(`跳过「${st.name}」？`, `非关键步骤可跳过。<br>跳过后的步骤将在总结页标记为 <b>未完成</b>，且可能影响后续功能（如跳过建图将无法导航）。确认继续吗？`, ()=>{
    appState.skip[s] = true;
    if(s < 12){
      moveStage();
      appState.golive._started = false;
      saveProgress();
      renderStage();
      toast('已跳过本步，继续后续流程','info');
    }
  });
});

/* ---------- 帮助弹层 ---------- */
const helpOverlay = $('#help-overlay');
function openHelp(){

/* ---------- 确认弹层 ---------- */
const confirmOverlay = $('#confirm-overlay');
let confirmCb = null;
function showConfirm(title, msg, cb){
  $('#confirm-ok').textContent='确认';$('#confirm-cancel').textContent='取消';
  $('#confirm-title').textContent = title;
  $('#confirm-msg').innerHTML = msg;
  confirmCb = cb;
  confirmOverlay.classList.add('on');
}

});

  // 禁行线草稿
  if(lineDraft){
    h += `<line x1="${lineDraft.x1}" y1="${lineDraft.y1}" x2="${lineDraft.x2||lineDraft.x1}" y2="${lineDraft.y2||lineDraft.y1}" stroke="#f87171" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round" opacity=".7"/>`;
  }
  // 点位
  MAP.points.forEach(p=>{
    h += `<g transform="translate(${p.x},${p.y})">
      <circle r="11" fill="${P_COLOR[p.type]}22" stroke="${P_COLOR[p.type]}" stroke-width="2"/>
      <circle r="3.5" fill="${P_COLOR[p.type]}"/>
      <rect x="-30" y="16" width="60" height="17" rx="8" fill="rgba(11,18,32,.85)" stroke="rgba(120,160,200,.25)"/>
      <text x="0" y="28.5" font-size="10" text-anchor="middle" fill="#e6eef5">${P_NAME[p.type]}</text>
    </g>`;
  });
  svg.innerHTML = h;
}
function robotSvg(){
  return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="11" rx="3" fill="#14202f" stroke="#22d3aa" stroke-width="1.6"/><circle cx="12" cy="4" r="2.2" fill="#14202f" stroke="#22d3aa" stroke-width="1.6"/><circle cx="9" cy="12.5" r="1.2" fill="#22d3aa"/><circle cx="15" cy="12.5" r="1.2" fill="#22d3aa"/><path d="M8 18l-1.5 3M16 18l1.5 3" stroke="#22d3aa" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
function renderMap(){
  renderMapTools();
  renderMapSide();
  renderMapCanvas();
  // 提示
  const hint = $('#map-hint');
  const foot = $('#map-foot-left');
  const notes = {
    view:'浏览地图 · 拖动画布查看',
    build:`遥控建图：沿墙行走覆盖全场 · <b>${MAP.build}%</b>`,
    edit:'地图已生成 · 可切换到禁行线 / 点位标注',
    line:'点击地图上<b>两个点</b>绘制禁行线（红色虚线）',
    point:`点击地图放置 <b>${P_NAME[MAP.ptType||'home']}</b> 标记`,
  };
  hint.innerHTML = notes[MAP.mode];
  hint.style.display = 'block';
  foot.textContent = '模式：' + TOOLS.find(t=>t.id===MAP.mode).n;
  $('#chip-map').textContent = MAP.saved ? '已保存' : '未保存';
}
/* 地图画布交互 */
$('#map-canvas').addEventListener('click', (e)=>{
  const r = e.target.closest('#map-canvas').getBoundingClientRect();
  // 注意：svg 使用 preserveAspectRatio，坐标需换算
  const vbW=720, vbH=440, cw=r.width, ch=r.height;
  const scale = Math.min(cw/vbW, ch/vbH);
  const offX = (cw - vbW*scale)/2, offY = (ch - vbH*scale)/2;
  const x = Math.round((e.clientX - r.left - offX)/scale);
  const y = Math.round((e.clientY - r.top - offY)/scale);
  if(MAP.mode==='line'){
    if(!lineDraft){
      lineDraft = {x1:x, y1:y, x2:x, y2:y};
    }else{
      lineDraft.x2 = x; lineDraft.y2 = y;
      MAP.lines.push({...lineDraft});
      lineDraft = null;
      renderMap();
      toast('禁行线已添加','ok');
    }
    renderMap();
  }else if(MAP.mode==='point'){
    MAP.points.push({type:MAP.ptType||'home', x, y, label:P_NAME[MAP.ptType||'home']});
    renderMap();
    toast(P_NAME[MAP.ptType||'home']+' 已标注','ok');
  }
});
$('#map-canvas').addEventListener('mousemove', (e)=>{
  if(MAP.mode==='line' && lineDraft){
    const r = e.target.closest('#map-canvas').getBoundingClientRect();
    const vbW=720, vbH=440, cw=r.width, ch=r.height;
    const scale = Math.min(cw/vbW, ch/vbH);
    const offX = (cw - vbW*scale)/2, offY = (ch - vbH*scale)/2;
    lineDraft.x2 = Math.round((e.clientX - r.left - offX)/scale);
    lineDraft.y2 = Math.round((e.clientY - r.top - offY)/scale);
    renderMapCanvas();
  }
});
/* 建图自动推进 */
let buildTimer = null;
function startBuild(){
  if(buildTimer) return;
  buildTimer = setInterval(()=>{
    if(MAP.mode!=='build' && MAP.mode!=='view') { /* 允许后台推进 */ }
    MAP.build = Math.min(100, MAP.build + 2 + Math.random()*3);
    renderMap();
    if(MAP.build>=100){
      clearInterval(buildTimer); buildTimer=null;
      MAP.built = true;
      renderMap();
      toast('建图完成，地图已生成','ok');
    }
  }, 420);
}
/* 重置 */
$('#map-btn-reset').addEventListener('click', ()=>{
  MAP.points = [{type:'home',x:118,y:92,label:'Home 点'},{type:'pick',x:560,y:286,label:'取货点'},{type:'place',x:250,y:330,label:'放置点'},{type:'charge',x:80,y:380,label:'充电点'}];
  MAP.lines = [{x1:330,y1:40,x2:330,y2:190},{x1:60,y1:210,x2:290,y2:210}];
  MAP.build = 62; MAP.built=false; MAP.saved=false; lineDraft=null;
  renderMap();
  toast('已重置为示例地图','info');
});
/* 保存并返回 */
$('#map-btn-save').addEventListener('click', ()=>{
  if(!MAP.built){toast('请先完成建图再保存','warn');return;}
  MAP.saved = true;
  renderMap();
  const from = appState.mapStage._from;
  // 标记对应阶段完成
  if(from===7){
    appState.mapStage.built = true;
    appState.done[7] = true;
  }else if(from===8){
    appState.mapStage.edited = true;
    appState.done[8] = true;
  }else{
    // 无来源：默认完成建图+编辑
    appState.mapStage.built = true;
    appState.mapStage.edited = true;
    appState.done[7] = true;
    appState.done[8] = true;
  }
  switchView('app');
  toast('地图已保存，返回 OOBE 向导','ok');
});

/* ---------- 视图切换 ---------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  const v = name==='map' ? $('#view-map') : $('#view-app');
  v.classList.add('on');
  $('#tab-'+name).classList.add('on');
  if(name==='map'){
    renderTrack();$('#map-guide-progress').innerHTML=$('.progress-rail').innerHTML.replace(/ id="[^"]*"/g,'');
    renderMap();
    if(MAP.mode==='build' && !MAP.built) startBuild();
  }else{
    renderStage();
  }
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ switchView(t.dataset.view); });
});

/* ---------- 启动 ---------- */
// 恢复上次进度（中途退出 / 再次开机）
const restored = loadProgress();
appState.mapStage.detected=false;appState.mapStage.detecting=false;
MAP.built=!!appState.mapStage.built;
if(MAP.built)MAP.build=100;
appState.update.checking=false;
renderStage();
if(restored && robotConnection.ready){
  toast(`已恢复到上次进度：第 ${appState.stage+1} 步 · ${STAGES[appState.stage].name}`, 'info');
}
// 自动保存进度：交互后与关闭前
document.addEventListener('click', ()=>{ setTimeout(saveProgress, 80); });
document.addEventListener('input', ()=>{ setTimeout(saveProgress, 80); });
window.addEventListener('beforeunload', ()=>{ saveProgress(); });
</script>
</body>
